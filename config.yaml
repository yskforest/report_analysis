# Report Analysis default configuration file

# このYAMLファイルで、report_analysis.pyが出力するカスタム可視化（TreemapやPie chart等）を設定できます。
# プレフィックス（cloc_, und_, pmd_, git_）付きのカラム名は、出力先の metrics_merge.csv のヘッダーに対応します。

visualizations:
  # ==============================================================================
  # 【主要可視化 5選（デフォルト有効）】
  # ==============================================================================

  # 1. コード行数 (cloc_code) を面積、PMD重複率 (pmd_PmdCloneRatio) を色にした Treemap
  - type: treemap
    metric_area: cloc_code
    metric_color: pmd_PmdCloneRatio
    output_file: "vis/cloc_pmd_treemap.html"

  # 2. CLOC の言語別コード行数比率を示す円グラフ
  - type: pie_chart
    metric: cloc_language
    value_metric: cloc_code
    output_file: "cloc/language_pie.html"

  # 3. コード行数 (und_CountLineCode) と複雑度 (und_AvgCyclomatic) の散布図
  - type: scatter
    metric_x: und_CountLineCode
    metric_y: und_AvgCyclomatic
    metric_size: und_CountLineComment
    hover_name: File
    output_file: "und/loc_vs_cyclomatic_scatter.html"

  # 4. 複雑度 (und_AvgCyclomatic) の分布を示すヒストグラム
  - type: histogram
    metric_x: und_AvgCyclomatic
    nbins: 60
    output_file: "und/cyclomatic_histogram.html"

  # 5. 重複トークン数 (pmd_PmdCloneTokensSum) の多い Top 20 ファイルの棒グラフ
  - type: bar
    metric_x: File
    metric_y: pmd_PmdCloneTokensSum
    top_n: 20
    output_file: "pmd/clone_tokens_bar.html"

  # ==============================================================================
  # 【追加オプション可視化（アンコメントで即座に利用可能）】
  # ==============================================================================

